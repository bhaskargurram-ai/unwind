[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unwind-mcp"
version = "0.1.0"
description = "A reversibility layer for agentic tool use — a transparent MCP proxy that classifies which tool calls can be taken back, synthesises inverse operations, keeps a durable cross-server undo log, and interrupts you only for genuinely irreversible actions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar Gurram", email = "bhaskar@zasti.ai" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-safety",
    "reversibility",
    "undo",
    "compensation",
    "llm-tools",
    "human-in-the-loop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.7",
    "anyio>=4.4",
    "typer>=0.12",
    "httpx>=0.27",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
metrics = ["numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.9"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-aiofiles",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-gen-files>=0.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.9",
]

[project.urls]
Homepage = "https://github.com/bhaskargurram-ai/unwind"
Documentation = "https://bhaskargurram-ai.github.io/unwind/"
Repository = "https://github.com/bhaskargurram-ai/unwind"
Issues = "https://github.com/bhaskargurram-ai/unwind/issues"
Changelog = "https://github.com/bhaskargurram-ai/unwind/blob/main/CHANGELOG.md"

[project.scripts]
unwind = "unwind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["unwind"]

# ---------------------------------------------------------------------------
# Ruff — lint + import sort (replaces flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["unwind", "bench", "eval", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line length handled by black
    "B008",   # typer uses function calls in defaults (Option/Argument)
    "RUF001", # ambiguous unicode in strings — en/em dashes are intentional typography
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["unwind", "bench", "eval"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["ts/", "paper/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["mcp.*", "structlog.*", "matplotlib.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# demo.py builds tiny in-line "tool" closures for illustration; full typing them
# adds noise without safety value.
module = ["unwind.demo"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "eval", "bench"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "protocol: protocol-conformance tests (mandatory gate)",
    "integration: integration tests requiring the docker sandbox",
    "llm: tests that call a real LLM (skipped without credentials)",
]

[tool.coverage.run]
source = ["unwind"]
branch = true
omit = ["unwind/__main__.py"]

[tool.coverage.report]
precision = 2
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AssertionError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# python-semantic-release — Conventional-Commit-driven versioning
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["unwind/__init__.py:__version__", "ts/src/version.ts:VERSION"]
build_command = "python -m pip install build && python -m build"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
default_templates.changelog_file = "CHANGELOG.md"
