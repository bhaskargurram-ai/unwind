version: 2
# Pre-launch posture: monthly, grouped minor/patch only, majors ignored (they
# need manual migration and each PR burns private-repo Actions minutes). After
# launch (public repo = free unlimited Actions), consider weekly + re-enabling
# major bumps as individual reviewable PRs.
updates:
  # --- Python (pip / pyproject) -------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "python"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "area: ci"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # --- npm (TypeScript shim) ----------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "area: ts"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
