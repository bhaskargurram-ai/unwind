version: 2
updates:
  # --- Python (pip / pyproject) -------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    # One grouped PR per ecosystem (all update types) to avoid PR spam.
    groups:
      python:
        patterns:
          - "*"

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "area: ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # --- npm (TypeScript shim) ----------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "area: ts"
    groups:
      npm:
        patterns:
          - "*"
