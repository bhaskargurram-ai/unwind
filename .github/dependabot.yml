version: 2
updates:
  # --- Python (pip / pyproject) -------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    # Group only safe minor/patch bumps into one PR; MAJOR bumps come as their
    # own reviewable PRs (they can break builds — e.g. mypy/ruff/pytest majors).
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "area: ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # --- npm (TypeScript shim) ----------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "area: ts"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
