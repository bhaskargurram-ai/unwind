name: "🐛 Bug report"
description: "Report a reproducible problem with Unwind."
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please search
        [existing issues](https://github.com/bhaskargurram-ai/unwind/issues) first.

        > ⚠️ **Security issue?** Do **not** file it here. Report privately per
        > [SECURITY.md](https://github.com/bhaskargurram-ai/unwind/blob/main/SECURITY.md).
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I am on the latest released version, or have noted my version below.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: "When I wrap the filesystem server, a write_file call is auto-allowed but never logged..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "The call should be captured in the undo log with pre-state."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Does this involve a fail-open?
      description: >-
        A "fail-open" is Unwind auto-allowing or failing to escalate an action it
        should have escalated (e.g. a true R4 action executed without confirmation).
        These are top priority.
      options:
        - "No"
        - "Yes — an action was auto-allowed / not escalated when it should have been"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact `unwind run -- ...` command (redact secrets) and steps.
      placeholder: |
        1. Run: unwind run -- npx -y @modelcontextprotocol/server-filesystem /work
        2. From the client, call ...
        3. Observe ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste structlog output or tracebacks. Redact anything sensitive.
      render: text
    validations:
      required: false
  - type: input
    id: unwind-version
    attributes:
      label: Unwind version
      description: Output of `unwind --version` (or the pip/npm/Docker tag).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Unwind?
      options:
        - pip (unwind-mcp)
        - uvx
        - npm (unwind-mcp)
        - Docker (ghcr.io/bhaskargurram-ai/unwind)
        - from source
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop / Claude Code / Cursor / VS Code / Cline / Windsurf / Goose / Zed / n8n / other"
    validations:
      required: true
  - type: input
    id: upstream-server
    attributes:
      label: Upstream MCP server being wrapped
      placeholder: "@modelcontextprotocol/server-filesystem, git, sqlite, ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and/or Node version
      placeholder: "macOS 14 · Python 3.12 · Node 22"
    validations:
      required: true
