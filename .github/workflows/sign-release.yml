name: Sign release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sigstore keyless signing
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload signatures to the release
      id-token: write         # OIDC identity for keyless Sigstore signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions to sign
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign dist blobs (keyless)
        run: |
          for blob in dist/*; do
            echo "Signing $blob"
            cosign sign-blob --yes \
              --output-signature "${blob}.sig" \
              --output-certificate "${blob}.pem" \
              "$blob"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Attach signatures to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.sig
            dist/*.pem
