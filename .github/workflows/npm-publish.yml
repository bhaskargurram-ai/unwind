name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish unwind-mcp to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    permissions:
      contents: read
      # Required for npm build provenance attestations (--provenance).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish (with provenance)
        run: npm publish --provenance --access public
        env:
          # NOTE: npm OIDC trusted publishing is not yet GA, so an automation
          # token is still required. Store it as the NPM_TOKEN repo secret and
          # migrate to OIDC once npm ships it (then this env can be dropped).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
