name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; jobs elevate only what they need.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev]"
      - name: ruff check (lint)
        run: ruff check .
      - name: black --check (format)
        run: black --check .

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install dev dependencies
        run: uv pip install --system -e ".[dev,metrics]"
      - name: mypy --strict
        run: mypy unwind

  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Pre-launch cost control: private-repo Actions minutes are metered and
    # macOS bills 10x / Windows 2x. We run the full Python range on Linux plus a
    # single macOS + Windows smoke cell (cross-OS is already proven green). At
    # launch the repo goes public (free unlimited Actions) — widen to the full
    # 3x3 matrix then by removing the `include` and listing all three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install with dev extras
        run: uv pip install --system -e ".[dev,metrics]"
      - name: Run tests with coverage
        run: >-
          pytest -m "not integration and not slow and not benchmark"
          --cov=unwind --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  conformance:
    name: Protocol conformance (mandatory gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install with dev extras
        run: uv pip install --system -e ".[dev]"
      - name: Protocol-conformance suite
        # Non-negotiable: a proxy that breaks a client is worthless.
        # Any method Unwind does not understand must be forwarded byte-faithfully.
        # Scope to the conformance dir so collection doesn't touch numpy-dependent
        # eval/bench modules (this job installs only the base dev extra).
        run: pytest tests/protocol_conformance -m protocol -ra

  ts:
    name: TypeScript shim (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  # A single required status check to gate merges on the whole matrix.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, test, conformance, ts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: >-
            ${{ needs.lint.result }} ${{ needs.typecheck.result }}
            ${{ needs.test.result }} ${{ needs.conformance.result }}
            ${{ needs.ts.result }}
        run: |
          echo "Required job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job concluded '$r' (expected 'success')."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
