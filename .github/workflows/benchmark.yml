name: Benchmark

on:
  # Cost control: don't run on every main push. Benchmarks run on PRs (to catch
  # regressions before merge) and manually. The trend chart publishes to gh-pages
  # only when the repo is public (gated in the job below).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: pytest-benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push benchmark data to the gh-pages branch
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install with dev extras
        run: uv pip install --system -e ".[dev,metrics]"

      - name: Run benchmarks
        # Emphasis: R0 (read) calls must stay ~free. This tracks the added-latency
        # regression the project's success contract depends on.
        run: pytest -m benchmark --benchmark-only --benchmark-json=output.json

      - name: Store benchmark result & alert on regression
        # The trend chart lives on gh-pages, which only exists once the repo is
        # public and Pages is enabled (at launch). Until then, still run the
        # benchmarks above (validates they work) but skip the publish.
        if: github.event.repository.visibility == 'public'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Unwind pytest-benchmark
          tool: pytest
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Publish a trend chart to gh-pages, only from main.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Flag a PR if it regresses added latency by >150%.
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: "@bhaskargurram-ai"
